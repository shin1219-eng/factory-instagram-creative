<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<meta name="palette-id" content="aqua-cobalt" />
<meta name="layout-id" content="arc-sweep" />
<title>C2_FV_arc-sweep_v04</title>
<style>
:root {
  --bg-1: #051b2a;
  --bg-2: #05070c;
  --accent: #29f0ff;
  --accent-2: #2a62ff;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 80% at 72% 14%, #0f3a55 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  font-family: "Trebuchet MS", "Helvetica", sans-serif;
}
canvas { display: block; }
#hud {
  position: absolute;
  left: 5vw;
  top: 10vh;
  display: grid;
  gap: 14px;
}
.hud-bar {
  width: 110px;
  height: 6px;
  background: linear-gradient(90deg, rgba(41,240,255,0.9), rgba(41,240,255,0));
  box-shadow: 0 0 18px rgba(41,240,255,0.4);
}
.hud-bar.short {
  width: 70px;
  opacity: 0.7;
}
.hud-pill {
  width: 120px;
  height: 28px;
  border-radius: 16px;
  border: 1px solid rgba(41,240,255,0.5);
  background: rgba(5, 15, 24, 0.6);
  box-shadow: 0 0 20px rgba(42,98,255,0.25);
}
#frame {
  position: absolute;
  inset: 5vh 4vw;
  border: 1px solid rgba(41,240,255,0.2);
  border-radius: 26px;
  box-shadow: inset 0 0 30px rgba(41,240,255,0.12);
  pointer-events: none;
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(60deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
  opacity: 0.4;
  mix-blend-mode: screen;
  pointer-events: none;
}
</style>
</head>
<body data-parallax="true" data-material="aqua">
<div id="hud">
  <div class="hud-bar"></div>
  <div class="hud-bar short"></div>
  <div class="hud-pill"></div>
</div>
<div id="frame"></div>
<div id="grain"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070c, 8, 18);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.2, 0.2, 6.0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a7db6, 0.7));
const key = new THREE.DirectionalLight(0xb3f4ff, 2.2);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.PointLight(0x2a62ff, 1.6, 16);
rim.position.set(-4, -2, 3);
scene.add(rim);

const arcGroup = new THREE.Group();

const ringMat = new THREE.MeshStandardMaterial({ color: 0x2bd9ff, metalness: 0.6, roughness: 0.2 });
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.05, 20, 220), ringMat);
ring.rotation.x = Math.PI / 2.2;
arcGroup.add(ring);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.03, 16, 220), new THREE.MeshStandardMaterial({ color: 0x2a62ff, metalness: 0.4, roughness: 0.35, transparent: true, opacity: 0.65 }));
ring2.rotation.x = Math.PI / 2.4;
ring2.rotation.z = Math.PI / 5;
arcGroup.add(ring2);

const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.2, -0.4, -0.6),
  new THREE.Vector3(-0.6, 0.4, 0.4),
  new THREE.Vector3(1.0, 0.1, 0.6),
  new THREE.Vector3(2.2, 0.6, -0.2)
]);
const tube = new THREE.TubeGeometry(curve, 200, 0.12, 12, false);
const tubeMat = new THREE.MeshPhysicalMaterial({ color: 0x9df7ff, metalness: 0.8, roughness: 0.15, clearcoat: 0.7 });
const sweep = new THREE.Mesh(tube, tubeMat);
arcGroup.add(sweep);

const sparkGeo = new THREE.IcosahedronGeometry(0.18, 1);
for (let i = 0; i < 8; i++) {
  const spark = new THREE.Mesh(sparkGeo, new THREE.MeshStandardMaterial({ color: 0x62e9ff, metalness: 0.5, roughness: 0.25 }));
  spark.position.set(Math.cos(i) * 1.6, Math.sin(i * 0.6) * 0.8, (i % 3) * 0.3 - 0.4);
  arcGroup.add(spark);
}

arcGroup.position.set(0.6, 0.2, 0);
scene.add(arcGroup);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.5;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.4;
});

let t = 0;
function animate() {
  t += 0.01;
  arcGroup.rotation.y = t * 0.2;
  arcGroup.rotation.x = Math.sin(t * 0.6) * 0.12;
  arcGroup.position.y = Math.sin(t * 0.8) * 0.08;

  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.y += (target.y - camera.position.y) * 0.05;
  camera.lookAt(0.4, 0.1, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
