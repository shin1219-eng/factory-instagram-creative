<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C1_KV_obsidian-ring_v01</title>
<style>
:root {
  --bg-1: #121317;
  --bg-2: #08090c;
  --glow: rgba(120, 150, 255, 0.25);
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(120% 80% at 35% 20%, #1b1f2c 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  overflow: hidden;
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
  mix-blend-mode: soft-light;
  opacity: 0.4;
}
#halo {
  position: absolute;
  inset: 0;
  background: radial-gradient(36% 30% at 50% 46%, rgba(160, 190, 255, 0.2), transparent 70%);
  mix-blend-mode: screen;
}
#contact-shadow {
  position: absolute;
  left: 50%;
  top: 63%;
  width: 360px;
  height: 120px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
  filter: blur(16px);
}
canvas { display: block; }
</style>
</head>
<body data-parallax="true" data-material="obsidian">
<div id="grain"></div>
<div id="contact-shadow"></div>
<div id="halo"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ringGeo = new THREE.TorusGeometry(0.92, 0.18, 80, 240);
const ringMat = new THREE.MeshStandardMaterial({
  color: 0x0f1116,
  metalness: 0.5,
  roughness: 0.22,
  emissive: 0x05060a,
  emissiveIntensity: 0.35
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.castShadow = true;
scene.add(ring);

const coreGeo = new THREE.IcosahedronGeometry(0.34, 2);
const coreMat = new THREE.MeshPhysicalMaterial({
  color: 0xd6c7b4,
  metalness: 0.9,
  roughness: 0.18,
  clearcoat: 0.45,
  clearcoatRoughness: 0.2
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.castShadow = true;
scene.add(core);

const veilGeo = new THREE.TorusGeometry(1.15, 0.04, 32, 160);
const veilMat = new THREE.MeshStandardMaterial({
  color: 0x7f93c7,
  transparent: true,
  opacity: 0.35,
  roughness: 0.4,
  metalness: 0.2
});
const veil = new THREE.Mesh(veilGeo, veilMat);
veil.rotation.x = Math.PI / 2.2;
scene.add(veil);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -1.35;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

scene.add(new THREE.AmbientLight(0x3b4254, 0.7));
const key = new THREE.SpotLight(0xffffff, 1.9, 15, Math.PI / 6, 0.4, 1.4);
key.position.set(2.6, 3.2, 4.4);
key.castShadow = true;
scene.add(key);
const rim = new THREE.PointLight(0x90a9ff, 1.4, 10);
rim.position.set(-3.1, -0.6, 3.4);
scene.add(rim);
const fill = new THREE.PointLight(0x5c6678, 0.7, 8);
fill.position.set(0, -2.2, 2.6);
scene.add(fill);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.35;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.25;
});

let t = 0;
function animate() {
  t += 0.008;
  ring.rotation.y += 0.004;
  ring.rotation.x = Math.sin(t * 0.6) * 0.08;
  core.rotation.y -= 0.006;
  core.rotation.x = Math.cos(t * 0.5) * 0.1;
  veil.rotation.z += 0.002;

  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.y += (target.y - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
