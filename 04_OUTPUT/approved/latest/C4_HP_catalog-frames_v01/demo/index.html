<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C4_HP_catalog-frames_v01</title>
<style>
:root {
  --bg: #efeae2;
  --ink: #1b1c1f;
  --muted: #6f6a63;
  --card: #ffffff;
  --line: rgba(27,28,31,0.12);
  --accent: #b4936a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Sora", "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
}
#page {
  width: 100%;
  height: 100%;
  padding: 54px 52px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 28px;
}
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: center;
}
.hero h1 {
  font-size: 38px;
  margin: 0 0 10px 0;
}
.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}
.frame {
  position: relative;
  width: 100%;
  height: 320px;
  border-radius: 26px;
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(20,20,20,0.12);
}
.frame::before {
  content: "";
  position: absolute;
  inset: 18% 18% auto auto;
  width: 160px;
  height: 200px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: linear-gradient(140deg, rgba(180,147,106,0.2), rgba(255,255,255,0.65));
}
.frame::after {
  content: "";
  position: absolute;
  inset: auto auto 18% 18%;
  width: 200px;
  height: 140px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.7);
}
.section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 16px;
  min-height: 84px;
}
.card h3 {
  margin: 0 0 8px 0;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.card p {
  margin: 0;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.4;
}
footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 720px) {
  #page { padding: 40px 26px; gap: 20px; }
  .hero { grid-template-columns: 1fr; }
  .section { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="page">
  <nav>
    <div>RePrompt</div>
    <div>Home</div>
  </nav>

  <div class="hero">
    <div>
      <h1>Catalog Frames</h1>
      <p>A homepage structure with modular cards, clear hierarchy, and calm spacing.</p>
    </div>
    <div class="frame" aria-hidden="true"></div>
  </div>

  <div class="section">
    <div class="card">
      <h3>Work</h3>
      <p>Three focused case previews, same rhythm.</p>
    </div>
    <div class="card">
      <h3>Services</h3>
      <p>Two-line summary, no clutter.</p>
    </div>
    <div class="card">
      <h3>Insights</h3>
      <p>Short list, no dates baked in.</p>
    </div>
  </div>

  <footer>
    <div>Contact</div>
    <div>Tokyo</div>
  </footer>
</div>
</body>
</html>
