<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C1_KV_asym-altar_v03</title>
<style>
:root {
  --bg-1: #0d1016;
  --bg-2: #05070b;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 80% at 70% 20%, #1a212c 0%, var(--bg-1) 44%, var(--bg-2) 100%);
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
  mix-blend-mode: soft-light;
  opacity: 0.5;
}
#vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(70% 60% at 55% 50%, transparent 35%, rgba(0,0,0,0.75) 100%);
  pointer-events: none;
}
#contact-shadow {
  position: absolute;
  left: 62%;
  top: 64%;
  width: 380px;
  height: 120px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
  filter: blur(18px);
}
canvas { display: block; }
</style>
</head>
<body data-parallax="true" data-material="metal">
<div id="grain"></div>
<div id="contact-shadow"></div>
<div id="vignette"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x07090d, 6, 12);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.6, 0.1, 4.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const altar = new THREE.Group();

const baseGeo = new THREE.CylinderGeometry(0.55, 0.75, 0.25, 48);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x1a1e26, metalness: 0.7, roughness: 0.35 });
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = -0.6;
base.castShadow = true;
altar.add(base);

const coreGeo = new THREE.IcosahedronGeometry(0.38, 2);
const coreMat = new THREE.MeshPhysicalMaterial({
  color: 0xe3d4c1,
  metalness: 0.95,
  roughness: 0.18,
  clearcoat: 0.65,
  clearcoatRoughness: 0.12
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.position.set(0.0, -0.15, 0.2);
core.castShadow = true;
altar.add(core);

const arcGeo = new THREE.TorusGeometry(1.1, 0.05, 36, 200, Math.PI * 1.5);
const arcMat = new THREE.MeshStandardMaterial({ color: 0x6c7a92, metalness: 0.5, roughness: 0.35, transparent: true, opacity: 0.6 });
const arc = new THREE.Mesh(arcGeo, arcMat);
arc.rotation.x = Math.PI / 2.4;
arc.rotation.z = Math.PI / 5;
arc.position.set(-0.2, 0.2, 0.1);
altar.add(arc);

const ribbonGeo = new THREE.TorusKnotGeometry(0.7, 0.18, 260, 36);
const ribbonMat = new THREE.MeshPhysicalMaterial({ color: 0x202631, metalness: 0.85, roughness: 0.24, clearcoat: 0.45 });
const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
ribbon.rotation.set(0.4, 0.6, 0.2);
ribbon.castShadow = true;
altar.add(ribbon);

scene.add(altar);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(7, 7),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -1.25;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

scene.add(new THREE.AmbientLight(0x3c4455, 0.7));
const key = new THREE.SpotLight(0xffffff, 2.4, 16, Math.PI / 6, 0.4, 1.2);
key.position.set(3.2, 3.1, 4.5);
key.castShadow = true;
scene.add(key);
const rim = new THREE.PointLight(0x7f96ff, 1.6, 10);
rim.position.set(-3.0, -0.6, 2.8);
scene.add(rim);
const fill = new THREE.PointLight(0x5a657a, 0.8, 9);
fill.position.set(0.8, -2.2, 2.8);
scene.add(fill);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.3;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.22;
});

let t = 0;
function animate() {
  t += 0.008;
  ribbon.rotation.y += 0.004;
  core.rotation.y -= 0.006;
  arc.rotation.z += 0.0015;
  altar.position.y = Math.sin(t * 0.7) * 0.05;

  camera.position.x += (target.x - camera.position.x) * 0.06;
  camera.position.y += (target.y - camera.position.y) * 0.06;
  camera.lookAt(0, -0.1, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
