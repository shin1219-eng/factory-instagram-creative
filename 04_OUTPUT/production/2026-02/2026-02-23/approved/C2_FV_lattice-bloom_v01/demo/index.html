<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C2_FV_lattice-bloom_v01</title>
<style>
:root {
  --bg-1: #101216;
  --bg-2: #0a0b0e;
  --ink: #e6edf7;
  --muted: rgba(230,237,247,0.6);
  --accent: rgba(120, 170, 255, 0.55);
  --accent-2: rgba(180, 135, 255, 0.45);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 90% at 28% 20%, #1c2433 0%, var(--bg-1) 52%, var(--bg-2) 100%);
  font-family: "Sora", "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 3px);
  opacity: 0.4;
  mix-blend-mode: soft-light;
}
#stage {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  perspective: 900px;
}
.lattice {
  position: absolute;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  background:
    radial-gradient(circle at 30% 30%, var(--accent), transparent 55%),
    radial-gradient(circle at 70% 60%, var(--accent-2), transparent 58%);
  box-shadow: 0 0 80px rgba(120,160,255,0.25);
  transform-style: preserve-3d;
  transition: transform 0.2s ease-out;
}
.lattice.layer-2 { width: 380px; height: 380px; opacity: 0.7; }
.lattice.layer-3 { width: 260px; height: 260px; opacity: 0.6; }
.gridline {
  position: absolute;
  width: 620px;
  height: 620px;
  border-radius: 50%;
  background:
    repeating-conic-gradient(from 0deg, rgba(255,255,255,0.06) 0 4deg, transparent 4deg 12deg);
  mask: radial-gradient(circle at center, transparent 0 44%, #000 46% 100%);
  opacity: 0.4;
}
#bloom {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #cfe0ff;
  box-shadow: 0 0 25px rgba(200,220,255,0.8);
  transform: translate(-50%, -50%);
}
#label {
  position: absolute;
  bottom: 18%;
  left: 12%;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
#title {
  position: absolute;
  bottom: 22%;
  left: 12%;
  font-size: 34px;
  letter-spacing: 0.02em;
}
@media (max-width: 720px) {
  .lattice { width: 360px; height: 360px; }
  .lattice.layer-2 { width: 260px; height: 260px; }
  .lattice.layer-3 { width: 180px; height: 180px; }
  .gridline { width: 420px; height: 420px; }
  #title { font-size: 28px; }
}
</style>
</head>
<body>
<div id="grain"></div>
<div id="stage">
  <div class="gridline"></div>
  <div class="lattice layer-1"></div>
  <div class="lattice layer-2"></div>
  <div class="lattice layer-3"></div>
  <div id="bloom"></div>
</div>
<div id="title">Lattice Bloom</div>
<div id="label">Interactive FV</div>
<script>
const layers = document.querySelectorAll('.lattice');
const bloom = document.getElementById('bloom');

function move(x, y) {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = (x - cx) / cx;
  const dy = (y - cy) / cy;

  layers.forEach((layer, i) => {
    const depth = (i + 1) * 16;
    const rx = dy * -7;
    const ry = dx * 8;
    layer.style.transform = `translate3d(${dx * depth}px, ${dy * depth}px, 0) rotateX(${rx}deg) rotateY(${ry}deg)`;
  });

  bloom.style.left = `${x}px`;
  bloom.style.top = `${y}px`;
}

window.addEventListener('pointermove', (e) => move(e.clientX, e.clientY));
move(window.innerWidth * 0.55, window.innerHeight * 0.46);
</script>
</body>
</html>
