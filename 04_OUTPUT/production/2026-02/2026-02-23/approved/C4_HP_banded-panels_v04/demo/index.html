<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<meta name="palette-id" content="rose-clay" />
<meta name="layout-id" content="banded-panels" />
<title>C4_HP_banded-panels_v04</title>
<style>
:root {
  --bg-1: #1b1213;
  --bg-2: #0f0a0b;
  --rose: #e5a8a1;
  --clay: #c47b6e;
  --sand: #f1d6c2;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(120% 80% at 60% 12%, #2d1a1b 0%, var(--bg-1) 50%, var(--bg-2) 100%);
  color: rgba(255, 230, 220, 0.85);
  font-family: "Palatino", "Times New Roman", serif;
}
canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
main {
  position: relative;
  z-index: 1;
}
section {
  min-height: 80vh;
  padding: 12vh 8vw;
  display: grid;
  gap: 2.5vh;
  align-content: center;
}
.bands {
  display: grid;
  gap: 12px;
}
.band {
  height: 18px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(229,168,161,0.8), rgba(196,123,110,0.1));
  box-shadow: 0 0 20px rgba(196,123,110,0.3);
}
.band.alt {
  background: linear-gradient(90deg, rgba(241,214,194,0.8), rgba(196,123,110,0.2));
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 2vw;
}
.tile {
  height: 180px;
  border: 1px solid rgba(229,168,161,0.35);
  border-radius: 20px;
  background: rgba(24, 13, 14, 0.7);
}
.footer {
  min-height: 50vh;
  padding-bottom: 16vh;
}
#grain {
  position: fixed;
  inset: 0;
  background-image: repeating-linear-gradient(65deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
  mix-blend-mode: screen;
  opacity: 0.35;
  pointer-events: none;
  z-index: 2;
}
</style>
</head>
<body data-parallax="true" data-material="rose">
<canvas id="scene"></canvas>
<main>
  <section>
    <div style="font-size:52px; max-width:520px;">Banded panels, soft matter, grounded mass.</div>
    <div class="bands">
      <div class="band"></div>
      <div class="band alt"></div>
      <div class="band"></div>
    </div>
  </section>
  <section>
    <div class="grid">
      <div class="tile"></div>
      <div class="tile"></div>
      <div class="tile"></div>
    </div>
  </section>
  <section class="footer">
    <div class="bands">
      <div class="band alt"></div>
      <div class="band"></div>
    </div>
  </section>
</main>
<div id="grain"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0f0a0b, 7, 18);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.0, 0.6, 7.0);

scene.add(new THREE.AmbientLight(0x7a4a45, 0.8));
const key = new THREE.PointLight(0xe5a8a1, 2.0, 16);
key.position.set(2.8, 3.2, 4.6);
scene.add(key);
const fill = new THREE.PointLight(0xf1d6c2, 1.2, 12);
fill.position.set(-3.2, -1.4, 3.4);
scene.add(fill);

const group = new THREE.Group();
const panelGeo = new THREE.PlaneGeometry(4.2, 1.1, 32, 8);
for (let i = 0; i < 5; i++) {
  const mat = new THREE.MeshStandardMaterial({
    color: i % 2 === 0 ? 0xe5a8a1 : 0xc47b6e,
    metalness: 0.2,
    roughness: 0.6,
    side: THREE.DoubleSide
  });
  const panel = new THREE.Mesh(panelGeo, mat);
  panel.position.set(0, -1.0 + i * 0.6, -i * 0.4);
  panel.rotation.x = -0.3 + i * 0.05;
  panel.rotation.y = i * 0.08;
  group.add(panel);
}
scene.add(group);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.4;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.3;
});

let t = 0;
function animate() {
  t += 0.01;
  group.rotation.y = Math.sin(t * 0.4) * 0.2;
  group.position.y = Math.sin(t * 0.6) * 0.08;

  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.y += (0.6 + target.y - camera.position.y) * 0.04;
  camera.lookAt(0, -0.2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
