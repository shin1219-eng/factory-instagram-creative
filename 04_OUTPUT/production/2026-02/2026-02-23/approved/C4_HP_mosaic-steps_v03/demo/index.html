<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C4_HP_mosaic-steps_v03</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');
:root {
  --bg: #f1ebe2;
  --ink: #1b1c1f;
  --muted: #6d665f;
  --card: #ffffff;
  --line: rgba(27,28,31,0.12);
  --accent: #b6936a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
}
#page {
  width: 100%;
  height: 100%;
  padding: 52px 48px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 24px;
}
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 22px;
  align-items: center;
}
.hero h1 {
  font-size: 36px;
  margin: 0 0 10px 0;
}
.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}
.mosaic {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  height: 320px;
}
.tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  display: grid;
  gap: 8px;
}
.tile.big {
  grid-column: span 2;
  grid-row: span 2;
}
.tile h3 {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}
.tile p {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
}
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
}
@media (max-width: 900px) {
  #page { padding: 40px 24px; }
  .hero { grid-template-columns: 1fr; }
  .mosaic { height: 260px; }
}
</style>
</head>
<body>
<div id="page">
  <nav>
    <div>RePrompt</div>
    <div>Home</div>
  </nav>

  <div class="hero">
    <div>
      <h1>Mosaic Steps</h1>
      <p>A homepage structure built from modular tiles and stepped hierarchy.</p>
    </div>
    <div class="mosaic">
      <div class="tile big">
        <h3>Hero</h3>
        <p>Main story lives here with a large visual.</p>
      </div>
      <div class="tile">
        <h3>Work</h3>
        <p>Case 01</p>
      </div>
      <div class="tile">
        <h3>Work</h3>
        <p>Case 02</p>
      </div>
      <div class="tile">
        <h3>Service</h3>
        <p>Focus A</p>
      </div>
      <div class="tile">
        <h3>Service</h3>
        <p>Focus B</p>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>Contact</div>
    <div>Tokyo</div>
  </div>
</div>
</body>
</html>
