<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C1_KV_orbit-sculpt_v01</title>
<style>
:root {
  --bg-1: #14171d;
  --bg-2: #0b0d12;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 80% at 35% 18%, #1e232b 0%, var(--bg-1) 46%, var(--bg-2) 100%);
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
  mix-blend-mode: soft-light;
  opacity: 0.5;
}
#halo {
  position: absolute;
  inset: 0;
  background: radial-gradient(40% 30% at 50% 46%, rgba(180,200,255,0.14), transparent 70%);
  mix-blend-mode: screen;
}
#contact-shadow {
  position: absolute;
  left: 50%;
  top: 62%;
  width: 360px;
  height: 120px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
  filter: blur(14px);
}
canvas { display: block; }
</style>
</head>
<body data-parallax="true" data-material="metal">
<div id="grain"></div>
<div id="contact-shadow"></div>
<div id="halo"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0d12, 6, 12);

const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.2, 4.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const knotGeo = new THREE.TorusKnotGeometry(0.82, 0.24, 260, 32);
const knotMat = new THREE.MeshPhysicalMaterial({
  color: 0x2b2f38,
  metalness: 0.9,
  roughness: 0.18,
  clearcoat: 0.55,
  clearcoatRoughness: 0.2,
  envMapIntensity: 1.0
});
const knot = new THREE.Mesh(knotGeo, knotMat);
knot.castShadow = true;
scene.add(knot);

const rimGeo = new THREE.TorusGeometry(1.15, 0.04, 40, 200);
const rimMat = new THREE.MeshStandardMaterial({
  color: 0x7f8aa0,
  metalness: 0.4,
  roughness: 0.3,
  transparent: true,
  opacity: 0.55
});
const rim = new THREE.Mesh(rimGeo, rimMat);
rim.rotation.x = Math.PI / 2.2;
scene.add(rim);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -1.35;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

scene.add(new THREE.AmbientLight(0x404652, 0.7));
const key = new THREE.SpotLight(0xffffff, 2.0, 16, Math.PI / 6, 0.4, 1.2);
key.position.set(2.8, 3.2, 4.2);
key.castShadow = true;
scene.add(key);
const rimLight = new THREE.PointLight(0x91a4ff, 1.4, 10);
rimLight.position.set(-3.2, -0.4, 3.2);
scene.add(rimLight);
const fill = new THREE.PointLight(0x5f6b80, 0.7, 8);
fill.position.set(0, -2.2, 2.4);
scene.add(fill);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.28;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.22;
});

let t = 0;
function animate() {
  t += 0.008;
  knot.rotation.y += 0.004;
  knot.rotation.x = Math.sin(t * 0.7) * 0.08;
  rim.rotation.z += 0.0016;

  camera.position.x += (target.x - camera.position.x) * 0.05;
  camera.position.y += (target.y - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
