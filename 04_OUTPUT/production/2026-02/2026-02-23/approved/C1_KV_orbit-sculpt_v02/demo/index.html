<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C1_KV_orbit-sculpt_v02</title>
<style>
:root {
  --bg-1: #0f1218;
  --bg-2: #07090d;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(120% 80% at 35% 18%, #1c212a 0%, var(--bg-1) 46%, var(--bg-2) 100%);
}
#grain {
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
  mix-blend-mode: soft-light;
  opacity: 0.5;
}
#vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(70% 60% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}
#contact-shadow {
  position: absolute;
  left: 50%;
  top: 64%;
  width: 380px;
  height: 120px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, transparent 70%);
  filter: blur(18px);
}
canvas { display: block; }
</style>
</head>
<body data-parallax="true" data-material="metal">
<div id="grain"></div>
<div id="contact-shadow"></div>
<div id="vignette"></div>
<script src="../../../../../../../vendor/three/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c12, 6, 12);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.15, 4.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const coreGeo = new THREE.IcosahedronGeometry(0.38, 2);
const coreMat = new THREE.MeshPhysicalMaterial({
  color: 0xe1d2bf,
  metalness: 0.95,
  roughness: 0.18,
  clearcoat: 0.6,
  clearcoatRoughness: 0.15,
  emissive: 0x0a0a0a,
  emissiveIntensity: 0.2
});
const core = new THREE.Mesh(coreGeo, coreMat);
core.castShadow = true;
scene.add(core);

const orbitGeo = new THREE.TorusKnotGeometry(0.9, 0.21, 260, 36);
const orbitMat = new THREE.MeshPhysicalMaterial({
  color: 0x1d222b,
  metalness: 0.85,
  roughness: 0.24,
  clearcoat: 0.5,
  clearcoatRoughness: 0.2
});
const orbit = new THREE.Mesh(orbitGeo, orbitMat);
orbit.castShadow = true;
scene.add(orbit);

const haloGeo = new THREE.TorusGeometry(1.25, 0.035, 36, 220);
const haloMat = new THREE.MeshStandardMaterial({
  color: 0x7f8aa2,
  metalness: 0.4,
  roughness: 0.3,
  transparent: true,
  opacity: 0.55
});
const halo = new THREE.Mesh(haloGeo, haloMat);
halo.rotation.x = Math.PI / 2.2;
scene.add(halo);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -1.4;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

scene.add(new THREE.AmbientLight(0x404652, 0.75));
const key = new THREE.SpotLight(0xffffff, 2.2, 16, Math.PI / 6, 0.4, 1.2);
key.position.set(2.8, 3.4, 4.4);
key.castShadow = true;
scene.add(key);
const rim = new THREE.PointLight(0x8fa6ff, 1.6, 10);
rim.position.set(-3.2, -0.4, 3.1);
scene.add(rim);
const fill = new THREE.PointLight(0x5f6b80, 0.8, 9);
fill.position.set(0, -2.4, 2.6);
scene.add(fill);

const target = { x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  target.x = (e.clientX / window.innerWidth - 0.5) * 0.25;
  target.y = (e.clientY / window.innerHeight - 0.5) * 0.2;
});

let t = 0;
function animate() {
  t += 0.008;
  orbit.rotation.y += 0.0045;
  orbit.rotation.x = Math.sin(t * 0.7) * 0.09;
  core.rotation.y -= 0.006;
  core.rotation.x = Math.cos(t * 0.5) * 0.1;
  halo.rotation.z += 0.0016;

  camera.position.x += (target.x - camera.position.x) * 0.06;
  camera.position.y += (target.y - camera.position.y) * 0.06;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
