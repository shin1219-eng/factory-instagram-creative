<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
<title>C2_FV_split-orbit_v03</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap');
:root {
  --bg-1: #0f1218;
  --bg-2: #0a0c11;
  --ink: #eef2f7;
  --muted: rgba(238,242,247,0.6);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #11151c 0%, #0b0d12 100%);
  font-family: "Manrope", "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  overflow: hidden;
}
#layout {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 0.45fr 0.55fr;
}
#copy {
  padding: 80px 56px;
  display: grid;
  gap: 18px;
  align-content: center;
}
#copy h1 {
  font-size: 38px;
  margin: 0;
  letter-spacing: 0.02em;
}
#copy p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  max-width: 260px;
}
#meta {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
#stage {
  position: relative;
}
#canvas {
  position: absolute;
  inset: 0;
}
#divider {
  position: absolute;
  left: 0;
  top: 12%;
  bottom: 12%;
  width: 1px;
  background: rgba(255,255,255,0.08);
}
@media (max-width: 900px) {
  #layout { grid-template-columns: 1fr; }
  #copy { padding: 56px 36px; }
  #divider { display: none; }
}
</style>
</head>
<body>
<div id="layout">
  <section id="copy">
    <div id="meta">Interactive FV</div>
    <h1>Split Orbit</h1>
    <p>Asymmetric layout with the motion anchored to the right side.</p>
  </section>
  <section id="stage">
    <div id="divider"></div>
    <canvas id="canvas"></canvas>
  </section>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let w = 0, h = 0;

function resize() {
  w = canvas.width = window.innerWidth * 0.55;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const pointer = { x: 0.5, y: 0.5 };
window.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width;
  pointer.y = (e.clientY - rect.top) / rect.height;
});

let t = 0;
function draw() {
  t += 0.01;
  ctx.clearRect(0, 0, w, h);
  const cx = w * 0.45 + Math.sin(t * 0.6) * 30 + (pointer.x - 0.5) * 60;
  const cy = h * 0.5 + Math.cos(t * 0.5) * 20 + (pointer.y - 0.5) * 60;

  ctx.strokeStyle = 'rgba(120, 160, 255, 0.45)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.28, h * 0.18, t * 0.2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(200, 140, 255, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx + 30, cy - 20, w * 0.2, h * 0.14, -t * 0.25, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = 'rgba(230, 240, 255, 0.9)';
  ctx.beginPath();
  ctx.arc(cx - 40, cy + 40, 6, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
